<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة الإدارة</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo" id="brandLogo"><span style="font-weight:900">₪</span></div>
        <div class="title">
          <b id="brandName">نظام الدوام والرواتب</b>
          <span id="brandSub">لوحة الإدارة</span>
        </div>
      </div>
      <div class="actions noprint" id="topActions"></div>
    </div>
  </div>

  <div class="container">
    <div class="card">
  <div class="card-h">
    <h2>لوحة الإدارة</h2>
    <div class="pilltabs" id="tabs">
      <button data-tab="company" class="active">بيانات الشركة</button>
      <button data-tab="departments">الأقسام</button>
      <button data-tab="employees">الموظفون</button>
      <button data-tab="managers">المدراء</button>
      <button data-tab="month">إعدادات الشهر</button>
      <button data-tab="attendance">تسجيل الدوام</button>
      <button data-tab="payroll">الرواتب</button>
      <button data-tab="excel">استيراد/تصدير</button>
    </div>
  </div>
  <div class="card-b">
    <section id="tab-company">
      <div class="form">
        <div><label>اسم الشركة</label><input id="companyName" /></div>
        <div><label>شعار الشركة</label><input id="companyLogo" type="file" accept="image/*" /><div class="small">يظهر في الصك وواجهة الموظف.</div></div>
        <button class="btn green" id="saveCompanyBtn">حفظ</button>
      </div>
    </section>

    <section id="tab-departments" style="display:none">
      <div class="row cols-2">
        <div><label>اسم القسم</label><input id="deptName" placeholder="مبيعات" /></div>
        <div style="display:flex;align-items:end;gap:10px"><button class="btn green" id="addDeptBtn">إضافة قسم</button></div>
      </div>
      <div class="hr"></div>
      <div class="tablewrap"><table><thead><tr><th>القسم</th><th>إجراءات</th></tr></thead><tbody id="deptTbody"></tbody></table></div>
    </section>

    <section id="tab-employees" style="display:none">
      <div class="row cols-3">
        <div><label>الاسم</label><input id="empNewName" /></div>
        <div><label>القسم</label><select id="empNewDept"></select></div>
        <div><label>الراتب الشهري</label><input id="empNewSalary" type="number" step="0.01" /></div>
      </div>
      <div class="row cols-2" style="margin-top:10px">
        <div><label>ملاحظة</label><input id="empNewNotes" /></div>
        <div style="display:flex;align-items:end;gap:10px"><button class="btn green" id="addEmpBtn">إضافة</button></div>
      </div>
      <div class="hr"></div>
      <label>بحث</label><input id="empSearch" placeholder="بحث..." />
      <div class="hr"></div>
      <div class="tablewrap"><table><thead><tr><th>الاسم</th><th>القسم</th><th>الراتب</th><th>ملاحظة</th><th>إجراءات</th></tr></thead><tbody id="empTbody"></tbody></table></div>
    </section>

    <section id="tab-managers" style="display:none">
      <div class="row cols-3">
        <div><label>username</label><input id="mgrUser" /></div>
        <div><label>password</label><input id="mgrPass" type="password" /></div>
        <div style="display:flex;align-items:end;gap:10px"><button class="btn green" id="addMgrBtn">إضافة مدير</button></div>
      </div>
      <div class="hr"></div>
      <div class="tablewrap"><table><thead><tr><th>username</th><th>password</th><th>إجراءات</th></tr></thead><tbody id="mgrTbody"></tbody></table></div>
    </section>

    <section id="tab-month" style="display:none">
      <div class="row cols-3">
        <div><label>الشهر</label><input id="msYm" type="month" /></div>
        <div><label>عدد الأيام</label><select id="msDays"><option>28</option><option>29</option><option>30</option><option>31</option></select></div>
        <div><label>ساعات العمل بالشهر</label><input id="msWorkHours" type="number" step="0.01" /></div>
      </div>
      <div class="row cols-3" style="margin-top:10px">
        <div><label>من</label><input id="msStart" type="time" /></div>
        <div><label>إلى</label><input id="msEnd" type="time" /></div>
        <div><label>سماح التأخير (د)</label><input id="msGrace" type="number" step="1" /></div>
      </div>
      <div class="row cols-3" style="margin-top:10px">
        <div><label>سماح الانصراف (د)</label><input id="msEarlyGrace" type="number" step="1" /></div>
        <div><label>معامل خصم التأخير</label><input id="msLateMul" type="number" step="0.01" /></div>
        <div><label>معامل خصم الانصراف</label><input id="msEarlyMul" type="number" step="0.01" /></div>
      </div>
      <div class="row cols-2" style="margin-top:10px">
        <div><label>معامل الإضافي</label><input id="msOtMul" type="number" step="0.01" /></div>
        <div style="display:flex;align-items:end;gap:10px"><button class="btn green" id="saveMsBtn">حفظ</button></div>
      </div>
    </section>

    <section id="tab-attendance" style="display:none">
      <div class="row cols-3">
        <div><label>الشهر</label><input id="attYm" type="month" /></div>
        <div><label>التاريخ</label><input id="attDate" type="date" /></div>
        <div><label>الموظف</label><select id="attEmp"></select></div>
      </div>
      <div class="row cols-3" style="margin-top:10px">
        <div><label>الدخول</label><input id="attIn" type="time" /></div>
        <div><label>الخروج</label><input id="attOut" type="time" /></div>
        <div><label>العذر</label><select id="attExcuse">
          <option value="none">بدون</option>
          <option value="late_excused">تأخير بعذر</option>
          <option value="early_excused">انصراف بعذر</option>
          <option value="absent_excused">غياب بعذر</option>
        </select></div>
      </div>
      <div class="row cols-2" style="margin-top:10px">
        <div><label>مشوار خارج المصنع</label><select id="attOutFactory"><option value="false">لا</option><option value="true">نعم</option></select></div>
        <div><label>ملاحظة</label><input id="attNote" /></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button class="btn green" id="saveAttBtn">حفظ/تحديث</button>
        <button class="btn red" id="delAttBtn">حذف</button>
        <button class="btn" id="calcAttBtn">احتساب</button>
      </div>
      <div class="hr"></div>
      <div class="kpis" id="attKpis"></div>
    </section>

    <section id="tab-payroll" style="display:none">
      <div class="row cols-3">
        <div><label>الشهر</label><input id="payYm" type="month" /></div>
        <div style="display:flex;align-items:end;gap:10px"><button class="btn green" id="refreshPayBtn">تحديث</button><button class="btn blue" id="exportPayBtn">تصدير CSV</button></div>
        <div class="help">السلف تُدخل من عمود السلف.</div>
      </div>
      <div class="hr"></div>
      <div class="tablewrap"><table><thead><tr>
        <th>الموظف</th><th>القسم</th><th>الراتب</th>
        <th>إضافي</th><th>قيمته</th>
        <th>تأخير</th><th>خصمه</th>
        <th>مبكر</th><th>خصمه</th>
        <th>السلف</th><th>المستحق</th><th>صك</th>
      </tr></thead><tbody id="payTbody"></tbody></table></div>
    </section>

    <section id="tab-excel" style="display:none">
      <div class="kpis">
        <div class="kpi"><span>Backup</span><b>JSON</b><button class="btn blue" id="exportJsonBtn">تصدير</button><input type="file" id="importJsonFile" accept=".json" /><button class="btn green" id="importJsonBtn">استيراد</button></div>
        <div class="kpi"><span>Employees</span><b>CSV</b><button class="btn blue" id="exportEmpCsvBtn">تصدير</button><input type="file" id="importEmpCsvFile" accept=".csv" /><button class="btn green" id="importEmpCsvBtn">استيراد</button></div>
        <div class="kpi"><span>Attendance</span><b>CSV</b><button class="btn blue" id="exportAttCsvBtn">تصدير</button><input type="file" id="importAttCsvFile" accept=".csv" /><button class="btn green" id="importAttCsvBtn">استيراد</button></div>
      </div>
      <div class="help" style="margin-top:10px">CSV يفتح في Excel.</div>
    </section>
  </div>
</div>

<script>
(function(){
  const A = window.PayrollApp;
  const s = A.getSession();
  if(!s || s.role!=="admin"){ location.replace("./index.html"); return; }
  document.getElementById("topActions").innerHTML = '<span class="badge">Admin</span><button class="btn" id="logoutBtn">خروج</button>';
  document.getElementById("logoutBtn").addEventListener("click", ()=>{ A.clearSession(); location.href="./index.html"; });

  let data = A.load();
  const brandName = document.getElementById("brandName");
  const brandLogo = document.getElementById("brandLogo");
  function refreshBrand(){
    data=A.load();
    if(data.company.companyName) brandName.textContent = data.company.companyName;
    if(data.company.companyLogo) brandLogo.innerHTML = '<img alt="logo" src="'+data.company.companyLogo+'">';
  }
  refreshBrand();

  // Tabs
  function showTab(name){
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===name));
    document.querySelectorAll(".card-b > section").forEach(sec=>sec.style.display="none");
    document.getElementById("tab-"+name).style.display="block";
    if(name==="departments") renderDepartments();
    if(name==="employees"){ fillDeptSelects(); renderEmployees(); }
    if(name==="managers") renderManagers();
    if(name==="month") loadMonthSettingsUI();
    if(name==="attendance"){ fillEmpSelect(); setAttendanceDefaults(); renderAttKpis(); }
    if(name==="payroll"){ loadPayrollUI(); renderPayroll(); }
  }
  document.getElementById("tabs").addEventListener("click",(e)=>{
    const btn=e.target.closest("button"); if(!btn) return;
    showTab(btn.dataset.tab);
  });

  // Company
  document.getElementById("companyName").value = data.company.companyName||"";
  document.getElementById("saveCompanyBtn").addEventListener("click", ()=>{
    data=A.load();
    data.company.companyName = document.getElementById("companyName").value.trim();
    const f = document.getElementById("companyLogo").files[0];
    if(f){
      A.setCompanyLogoFromFile(f,(b64)=>{ data.company.companyLogo=b64; A.save(data); refreshBrand(); A.toast("تم","تم حفظ بيانات الشركة."); });
    }else{ A.save(data); refreshBrand(); A.toast("تم","تم حفظ بيانات الشركة."); }
  });

  // Departments
  function renderDepartments(){
    data=A.load();
    const tb=document.getElementById("deptTbody"); tb.innerHTML="";
    data.departments.forEach(d=>{
      const tr=document.createElement("tr");
      tr.innerHTML = '<td><input data-id="'+d.id+'" value="'+(d.name||"").replace(/"/g,"&quot;")+'"></td>'
        +'<td style="display:flex;gap:8px"><button class="btn green" data-save="'+d.id+'">حفظ</button><button class="btn red" data-del="'+d.id+'">حذف</button></td>';
      tb.appendChild(tr);
    });
  }
  document.getElementById("addDeptBtn").addEventListener("click", ()=>{
    const name=document.getElementById("deptName").value.trim();
    if(!name) return A.toast("تنبيه","اكتب اسم القسم.");
    data=A.load();
    data.departments.push({id:A.uid(), name});
    A.save(data);
    document.getElementById("deptName").value="";
    renderDepartments();
  });
  document.getElementById("deptTbody").addEventListener("click",(e)=>{
    const saveBtn = e.target.closest("button[data-save]");
    const delBtn = e.target.closest("button[data-del]");
    if(!saveBtn && !delBtn) return;
    data=A.load();
    const id = (saveBtn||delBtn).dataset.save || (saveBtn||delBtn).dataset.del;
    const dep = data.departments.find(x=>x.id===id); if(!dep) return;
    if(saveBtn){
      const inp = document.querySelector('#deptTbody input[data-id="'+id+'"]');
      dep.name = inp.value.trim() || dep.name;
      A.save(data);
      renderDepartments();
    }else{
      if(!confirm("حذف القسم؟")) return;
      data.departments = data.departments.filter(x=>x.id!==id);
      data.employees.forEach(emp=>{ if(emp.departmentId===id) emp.departmentId=""; });
      A.save(data);
      renderDepartments();
    }
  });

  function fillDeptSelects(){
    data=A.load();
    const sel=document.getElementById("empNewDept");
    sel.innerHTML = '<option value="">—</option>' + data.departments.map(d=>'<option value="'+d.id+'">'+d.name+'</option>').join("");
  }

  // Employees
  function renderEmployees(){
    data=A.load();
    const q=document.getElementById("empSearch").value.trim().toLowerCase();
    const tb=document.getElementById("empTbody"); tb.innerHTML="";
    data.employees.filter(e=>{
      if(!q) return true;
      const dept = data.departments.find(d=>d.id===e.departmentId)?.name||"";
      return (e.name||"").toLowerCase().includes(q) || dept.toLowerCase().includes(q);
    }).forEach(e=>{
      const tr=document.createElement("tr");
      tr.innerHTML = '<td><input data-id="'+e.id+'" data-f="name" value="'+(e.name||"").replace(/"/g,"&quot;")+'"></td>'
        +'<td><select data-id="'+e.id+'" data-f="departmentId">'
        +'<option value="">—</option>'
        +data.departments.map(d=>'<option value="'+d.id+'" '+(d.id===e.departmentId?'selected':'')+'>'+d.name+'</option>').join("")
        +'</select></td>'
        +'<td><input type="number" step="0.01" data-id="'+e.id+'" data-f="monthlySalary" value="'+Number(e.monthlySalary||0)+'"></td>'
        +'<td><input data-id="'+e.id+'" data-f="notes" value="'+(e.notes||"").replace(/"/g,"&quot;")+'"></td>'
        +'<td style="display:flex;gap:8px"><button class="btn green" data-esave="'+e.id+'">حفظ</button><button class="btn red" data-edel="'+e.id+'">حذف</button></td>';
      tb.appendChild(tr);
    });
  }
  document.getElementById("empSearch").addEventListener("input", renderEmployees);
  document.getElementById("addEmpBtn").addEventListener("click", ()=>{
    const name=document.getElementById("empNewName").value.trim();
    if(!name) return A.toast("تنبيه","اكتب اسم الموظف.");
    data=A.load();
    if(data.employees.find(e=>A.normalizeName(e.name)===A.normalizeName(name))) return A.toast("موجود","هناك موظف بنفس الاسم.");
    data.employees.push({
      id:A.uid(),
      name,
      departmentId: document.getElementById("empNewDept").value||"",
      monthlySalary: Number(document.getElementById("empNewSalary").value||0),
      notes: document.getElementById("empNewNotes").value.trim()
    });
    A.save(data);
    document.getElementById("empNewName").value="";
    document.getElementById("empNewSalary").value="";
    document.getElementById("empNewNotes").value="";
    renderEmployees();
  });
  document.getElementById("empTbody").addEventListener("click",(e)=>{
    const sBtn=e.target.closest("button[data-esave]");
    const dBtn=e.target.closest("button[data-edel]");
    if(!sBtn && !dBtn) return;
    const id=(sBtn||dBtn).dataset.esave || (sBtn||dBtn).dataset.edel;
    data=A.load();
    const emp=data.employees.find(x=>x.id===id); if(!emp) return;
    if(sBtn){
      document.querySelectorAll('[data-id="'+id+'"]').forEach(inp=>{
        const f=inp.dataset.f;
        if(!f) return;
        if(f==="monthlySalary") emp[f]=Number(inp.value||0);
        else emp[f]=inp.value;
      });
      emp.name=String(emp.name||"").trim();
      emp.notes=String(emp.notes||"").trim();
      A.save(data); renderEmployees();
    }else{
      if(!confirm("حذف الموظف؟")) return;
      data.employees=data.employees.filter(x=>x.id!==id);
      A.save(data); renderEmployees();
    }
  });

  // Managers
  function renderManagers(){
    data=A.load();
    const tb=document.getElementById("mgrTbody"); tb.innerHTML="";
    data.managers.forEach(m=>{
      const tr=document.createElement("tr");
      tr.innerHTML = '<td><input data-id="'+m.id+'" data-f="username" value="'+(m.username||"").replace(/"/g,"&quot;")+'"></td>'
        +'<td><input data-id="'+m.id+'" data-f="password" value="'+(m.password||"").replace(/"/g,"&quot;")+'"></td>'
        +'<td style="display:flex;gap:8px"><button class="btn green" data-msave="'+m.id+'">حفظ</button><button class="btn red" data-mdel="'+m.id+'">حذف</button></td>';
      tb.appendChild(tr);
    });
  }
  document.getElementById("addMgrBtn").addEventListener("click", ()=>{
    const u=document.getElementById("mgrUser").value.trim();
    const p=document.getElementById("mgrPass").value.trim();
    if(!u||!p) return A.toast("تنبيه","أدخل username و password.");
    data=A.load();
    if(data.managers.find(x=>String(x.username||"").toLowerCase()===u.toLowerCase())) return A.toast("موجود","username مستخدم.");
    data.managers.push({id:A.uid(), username:u, password:p});
    A.save(data);
    document.getElementById("mgrUser").value=""; document.getElementById("mgrPass").value="";
    renderManagers();
  });
  document.getElementById("mgrTbody").addEventListener("click",(e)=>{
    const sBtn=e.target.closest("button[data-msave]");
    const dBtn=e.target.closest("button[data-mdel]");
    if(!sBtn && !dBtn) return;
    const id=(sBtn||dBtn).dataset.msave || (sBtn||dBtn).dataset.mdel;
    data=A.load();
    const m=data.managers.find(x=>x.id===id); if(!m) return;
    if(sBtn){
      document.querySelectorAll('#mgrTbody [data-id="'+id+'"]').forEach(inp=>{
        m[inp.dataset.f]=inp.value.trim();
      });
      A.save(data); renderManagers();
    }else{
      if(!confirm("حذف المدير؟")) return;
      data.managers=data.managers.filter(x=>x.id!==id);
      A.save(data); renderManagers();
    }
  });

  // Month settings
  function loadMonthSettingsUI(){
    data=A.load();
    const now=new Date(); const ymKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
    document.getElementById("msYm").value=ymKey;
    const ms=A.ensureMonthSettings(data, ymKey);
    document.getElementById("msDays").value=String(ms.daysInMonth||30);
    document.getElementById("msWorkHours").value=ms.workHoursInMonth||208;
    document.getElementById("msStart").value=ms.shiftStart||"09:00";
    document.getElementById("msEnd").value=ms.shiftEnd||"17:00";
    document.getElementById("msGrace").value=ms.lateGraceMinutes||0;
    document.getElementById("msEarlyGrace").value=ms.earlyLeaveGraceMinutes||0;
    document.getElementById("msLateMul").value=ms.latePenaltyMultiplier||1.5;
    document.getElementById("msEarlyMul").value=ms.earlyPenaltyMultiplier||1.0;
    document.getElementById("msOtMul").value=ms.overtimeMultiplier||1.5;
  }
  document.getElementById("msYm").addEventListener("change", ()=>{
    data=A.load();
    const ymKey=document.getElementById("msYm").value;
    const ms=A.ensureMonthSettings(data, ymKey);
    document.getElementById("msDays").value=String(ms.daysInMonth||30);
    document.getElementById("msWorkHours").value=ms.workHoursInMonth||208;
    document.getElementById("msStart").value=ms.shiftStart||"09:00";
    document.getElementById("msEnd").value=ms.shiftEnd||"17:00";
    document.getElementById("msGrace").value=ms.lateGraceMinutes||0;
    document.getElementById("msEarlyGrace").value=ms.earlyLeaveGraceMinutes||0;
    document.getElementById("msLateMul").value=ms.latePenaltyMultiplier||1.5;
    document.getElementById("msEarlyMul").value=ms.earlyPenaltyMultiplier||1.0;
    document.getElementById("msOtMul").value=ms.overtimeMultiplier||1.5;
  });
  document.getElementById("saveMsBtn").addEventListener("click", ()=>{
    data=A.load();
    const ymKey=document.getElementById("msYm").value;
    const ms=A.ensureMonthSettings(data, ymKey);
    ms.daysInMonth=Number(document.getElementById("msDays").value||30);
    ms.workHoursInMonth=Number(document.getElementById("msWorkHours").value||0);
    ms.shiftStart=document.getElementById("msStart").value||"09:00";
    ms.shiftEnd=document.getElementById("msEnd").value||"17:00";
    ms.lateGraceMinutes=Number(document.getElementById("msGrace").value||0);
    ms.earlyLeaveGraceMinutes=Number(document.getElementById("msEarlyGrace").value||0);
    ms.latePenaltyMultiplier=Number(document.getElementById("msLateMul").value||1.5);
    ms.earlyPenaltyMultiplier=Number(document.getElementById("msEarlyMul").value||1.0);
    ms.overtimeMultiplier=Number(document.getElementById("msOtMul").value||1.5);
    A.save(data); A.toast("تم","تم حفظ إعدادات الشهر.");
  });

  // Attendance
  function fillEmpSelect(){
    data=A.load();
    const sel=document.getElementById("attEmp");
    sel.innerHTML = data.employees.map(e=>'<option value="'+e.id+'">'+e.name+'</option>').join("");
  }
  function setAttendanceDefaults(){
    const now=new Date(); const ymKey=A.ym(now);
    document.getElementById("attYm").value=ymKey;
    document.getElementById("attDate").value=A.ymd(now);
  }
  function ctx(){return {ymKey:document.getElementById("attYm").value, date:document.getElementById("attDate").value, empId:document.getElementById("attEmp").value};}
  function loadAttForm(){
    data=A.load();
    const {date,empId}=ctx();
    const rec=(data.attendance[date]||{})[empId]||null;
    document.getElementById("attIn").value=rec?.checkIn||"";
    document.getElementById("attOut").value=rec?.checkOut||"";
    document.getElementById("attExcuse").value=rec?.excuseType||"none";
    document.getElementById("attOutFactory").value=String(!!rec?.outOfFactory);
    document.getElementById("attNote").value=rec?.note||"";
    renderAttKpis();
  }
  ["attDate","attEmp"].forEach(id=>document.getElementById(id).addEventListener("change", loadAttForm));
  function renderAttKpis(){
    data=A.load();
    const {ymKey,date,empId}=ctx();
    if(!ymKey||!date||!empId) return;
    const ms=A.ensureMonthSettings(data, ymKey);
    const rec=(data.attendance[date]||{})[empId]||{
      checkIn:document.getElementById("attIn").value||"",
      checkOut:document.getElementById("attOut").value||"",
      excuseType:document.getElementById("attExcuse").value||"none",
      outOfFactory:document.getElementById("attOutFactory").value==="true",
      note:document.getElementById("attNote").value||""
    };
    const m=A.calcDayMetrics(ms, rec);
    document.getElementById("attKpis").innerHTML =
      '<div class="kpi"><span>التأخير</span><b>'+A.minutesToHM(m.lateMinutes)+'</b></div>'
     +'<div class="kpi"><span>الانصراف</span><b>'+A.minutesToHM(m.earlyLeaveMinutes)+'</b></div>'
     +'<div class="kpi"><span>الإضافي</span><b>'+A.minutesToHM(m.overtimeMinutes)+'</b></div>'
     +'<div class="kpi"><span>العذر</span><b>'+(rec.excuseType||"none")+'</b></div>';
  }
  document.getElementById("calcAttBtn").addEventListener("click", renderAttKpis);
  document.getElementById("saveAttBtn").addEventListener("click", ()=>{
    data=A.load();
    const {ymKey,date,empId}=ctx();
    if(!ymKey||!date||!empId) return A.toast("تنبيه","حدد الشهر/التاريخ/الموظف.");
    A.ensureMonthSettings(data, ymKey);
    if(!data.attendance[date]) data.attendance[date]={};
    data.attendance[date][empId]={date,employeeId:empId,checkIn:document.getElementById("attIn").value||"",checkOut:document.getElementById("attOut").value||"",excuseType:document.getElementById("attExcuse").value||"none",outOfFactory:document.getElementById("attOutFactory").value==="true",note:document.getElementById("attNote").value||""};
    A.save(data); renderAttKpis(); A.toast("تم","تم حفظ الدوام.");
  });
  document.getElementById("delAttBtn").addEventListener("click", ()=>{
    data=A.load();
    const {date,empId}=ctx();
    if(!(data.attendance[date]&&data.attendance[date][empId])) return A.toast("لا يوجد","لا يوجد تسجيل.");
    if(!confirm("حذف التسجيل؟")) return;
    delete data.attendance[date][empId];
    if(Object.keys(data.attendance[date]).length===0) delete data.attendance[date];
    A.save(data); loadAttForm(); A.toast("تم","تم الحذف.");
  });

  // Payroll
  function loadPayrollUI(){
    const now=new Date();
    document.getElementById("payYm").value=A.ym(now);
  }
  function renderPayroll(){
    data=A.load();
    const ymKey=document.getElementById("payYm").value;
    const pay=A.computePayrollForMonth(data, ymKey);
    const tb=document.getElementById("payTbody"); tb.innerHTML="";
    const advMonth=data.advances[ymKey]||{};
    pay.rows.forEach(r=>{
      const adv=advMonth[r.employeeId]?.amount ?? 0;
      const tr=document.createElement("tr");
      tr.innerHTML =
        '<td>'+r.name+'</td><td>'+(r.department||"—")+'</td><td>'+A.money(r.salary)+'</td>'
       +'<td>'+A.minutesToHM(r.totalOTMinutes)+'</td><td>'+A.money(r.overtimeValue)+'</td>'
       +'<td>'+A.minutesToHM(r.totalLateMinutes)+'</td><td>'+A.money(r.lateDeduction)+'</td>'
       +'<td>'+A.minutesToHM(r.totalEarlyMinutes)+'</td><td>'+A.money(r.earlyDeduction)+'</td>'
       +'<td><input type="number" step="0.01" min="0" value="'+Number(adv)+'" data-adv="'+r.employeeId+'" style="width:110px"></td>'
       +'<td><b>'+A.money(r.net)+'</b></td>'
       +'<td><button class="btn blue" data-slip="'+r.employeeId+'">صك</button></td>';
      tb.appendChild(tr);
    });
  }
  document.getElementById("refreshPayBtn").addEventListener("click", renderPayroll);
  document.getElementById("payYm").addEventListener("change", renderPayroll);
  document.getElementById("payTbody").addEventListener("change",(e)=>{
    const inp=e.target.closest("input[data-adv]"); if(!inp) return;
    const empId=inp.dataset.adv;
    const ymKey=document.getElementById("payYm").value;
    data=A.load();
    if(!data.advances[ymKey]) data.advances[ymKey]={};
    data.advances[ymKey][empId]={amount:Number(inp.value||0),note:""};
    A.save(data); renderPayroll();
  });

  const modal=document.getElementById("modal");
  const modalBody=document.getElementById("modalBody");
  const modalTitle=document.getElementById("modalTitle");
  document.getElementById("modalCloseBtn").addEventListener("click", ()=>modal.classList.remove("show"));
  document.getElementById("modalPrintBtn").addEventListener("click", ()=>{
    const w=window.open("","_blank");
    w.document.open();
    w.document.write('<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pay Slip</title></head><body>'+modalBody.innerHTML+'</body></html>');
    w.document.close(); w.focus(); w.print();
  });
  document.getElementById("payTbody").addEventListener("click",(e)=>{
    const btn=e.target.closest("button[data-slip]"); if(!btn) return;
    const empId=btn.dataset.slip;
    const ymKey=document.getElementById("payYm").value;
    data=A.load();
    modalTitle.textContent="صك قبض";
    modalBody.innerHTML=A.buildPaySlipHTML(data, ymKey, empId);
    modal.classList.add("show");
  });

  document.getElementById("exportPayBtn").addEventListener("click", ()=>{
    data=A.load();
    const ymKey=document.getElementById("payYm").value;
    const pay=A.computePayrollForMonth(data, ymKey);
    const headers=["اسم الموظف","القسم","الراتب","إجمالي الإضافي (ساعات)","قيمة الإضافي","إجمالي التأخير (ساعات)","خصم التأخير","إجمالي الانصراف المبكر (ساعات)","خصم الانصراف المبكر","السلف","المستحق"];
    const rows=pay.rows.map(r=>[
      r.name, r.department, r.salary,
      (r.totalOTMinutes/60).toFixed(2), r.overtimeValue.toFixed(2),
      (r.totalLateMinutes/60).toFixed(2), r.lateDeduction.toFixed(2),
      (r.totalEarlyMinutes/60).toFixed(2), r.earlyDeduction.toFixed(2),
      r.advances.toFixed(2), r.net.toFixed(2)
    ]);
    const esc=(v)=>{const s=String(v??""); return /[,"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    const out=[headers.map(esc).join(",")].concat(rows.map(r=>r.map(esc).join(","))).join("\n");
    A.downloadText("payroll_"+ymKey+".csv", out, "text/csv;charset=utf-8");
  });

  // JSON export/import
  document.getElementById("exportJsonBtn").addEventListener("click", ()=>{
    data=A.load();
    A.downloadText("backup_payroll.json", JSON.stringify(data,null,2), "application/json;charset=utf-8");
  });
  document.getElementById("importJsonBtn").addEventListener("click", ()=>{
    const f=document.getElementById("importJsonFile").files[0];
    if(!f) return A.toast("تنبيه","اختر ملف JSON.");
    if(!confirm("سيتم استبدال البيانات بالكامل. متابعة؟")) return;
    const r=new FileReader();
    r.onload=()=>{ try{ localStorage.setItem("payroll_static_v1", String(r.result||"")); A.toast("تم","تم الاستيراد."); setTimeout(()=>location.reload(),700);}catch(e){A.toast("خطأ","ملف غير صالح.");} };
    r.readAsText(f,"utf-8");
  });

  // CSV parsing
  function parseCSVText(text){
    const rows=[]; let i=0, field="", row=[], inQ=false;
    while(i<text.length){
      const c=text[i];
      if(inQ){
        if(c=='"'){ if(text[i+1]=='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; }
        field+=c; i++; continue;
      }else{
        if(c=='"'){ inQ=true; i++; continue; }
        if(c==","){ row.push(field); field=""; i++; continue; }
        if(c=="\n"){ row.push(field); field=""; row=row.map(x=>x.replace(/\r/g,"")); if(row.length>1 || (row[0]||"").trim()!=="") rows.push(row); row=[]; i++; continue; }
        field+=c; i++; continue;
      }
    }
    row.push(field); row=row.map(x=>x.replace(/\r/g,""));
    if(row.length>1 || (row[0]||"").trim()!=="") rows.push(row);
    return rows;
  }

  // Employees CSV import/export
  document.getElementById("exportEmpCsvBtn").addEventListener("click", ()=>{
    data=A.load();
    const headers=["الاسم","القسم","الراتب الشهري","ملاحظة"];
    const rows=data.employees.map(e=>[
      e.name,
      data.departments.find(d=>d.id===e.departmentId)?.name||"",
      Number(e.monthlySalary||0),
      e.notes||""
    ]);
    const esc=(v)=>{const s=String(v??""); return /[,"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    const out=[headers.map(esc).join(",")].concat(rows.map(r=>r.map(esc).join(","))).join("\n");
    A.downloadText("employees.csv", out, "text/csv;charset=utf-8");
  });

  document.getElementById("importEmpCsvBtn").addEventListener("click", ()=>{
    const f=document.getElementById("importEmpCsvFile").files[0];
    if(!f) return A.toast("تنبيه","اختر employees.csv");
    const rr=new FileReader();
    rr.onload=()=>{
      const rows=parseCSVText(String(rr.result||""));
      if(rows.length<2) return A.toast("خطأ","CSV فارغ");
      const headers=rows[0].map(h=>h.trim());
      const idx=(n)=>headers.indexOf(n);
      const iName=idx("الاسم"), iDept=idx("القسم"), iSal=idx("الراتب الشهري"), iNote=idx("ملاحظة");
      if(iName<0||iDept<0||iSal<0) return A.toast("خطأ","عناوين الأعمدة غير صحيحة");
      data=A.load();
      const deptMap={}; data.departments.forEach(d=>deptMap[d.name.trim()]=d.id);
      for(let i=1;i<rows.length;i++){
        const r=rows[i];
        const name=(r[iName]||"").trim(); if(!name) continue;
        const deptName=(r[iDept]||"").trim();
        const salary=Number((r[iSal]||"0").replace(/[^\d.\-]/g,""))||0;
        const note=iNote>=0?(r[iNote]||"").trim():"";
        let deptId="";
        if(deptName){
          if(!deptMap[deptName]){ const newId=A.uid(); data.departments.push({id:newId,name:deptName}); deptMap[deptName]=newId; }
          deptId=deptMap[deptName];
        }
        const ex=data.employees.find(e=>A.normalizeName(e.name)===A.normalizeName(name));
        if(ex){ ex.departmentId=deptId; ex.monthlySalary=salary; ex.notes=note; }
        else data.employees.push({id:A.uid(), name, departmentId:deptId, monthlySalary:salary, notes:note});
      }
      A.save(data);
      fillDeptSelects(); renderEmployees(); renderDepartments();
      A.toast("تم","تم استيراد الموظفين.");
    };
    rr.readAsText(f,"utf-8");
  });

  // Attendance CSV export/import
  document.getElementById("exportAttCsvBtn").addEventListener("click", ()=>{
    data=A.load();
    const headers=["التاريخ","اسم الموظف","الدخول","الخروج","عذر (نعم/لا)","نوع العذر","مشوار خارج المصنع (نعم/لا)","ملاحظة"];
    const rows=[];
    Object.keys(data.attendance||{}).sort().forEach(date=>{
      const day=data.attendance[date]||{};
      Object.keys(day).forEach(empId=>{
        const rec=day[empId];
        const emp=data.employees.find(e=>e.id===empId);
        rows.push([
          date,
          emp?emp.name:"",
          rec.checkIn||"",
          rec.checkOut||"",
          (rec.excuseType&&rec.excuseType!=="none")?"نعم":"لا",
          rec.excuseType||"none",
          rec.outOfFactory?"نعم":"لا",
          rec.note||""
        ]);
      });
    });
    const esc=(v)=>{const s=String(v??""); return /[,"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    const out=[headers.map(esc).join(",")].concat(rows.map(r=>r.map(esc).join(","))).join("\n");
    A.downloadText("attendance.csv", out, "text/csv;charset=utf-8");
  });

  document.getElementById("importAttCsvBtn").addEventListener("click", ()=>{
    const f=document.getElementById("importAttCsvFile").files[0];
    if(!f) return A.toast("تنبيه","اختر attendance.csv");
    const rr=new FileReader();
    rr.onload=()=>{
      const rows=parseCSVText(String(rr.result||""));
      if(rows.length<2) return A.toast("خطأ","CSV فارغ");
      const headers=rows[0].map(h=>h.trim());
      const idx=(n)=>headers.indexOf(n);
      const iDate=idx("التاريخ"), iEmp=idx("اسم الموظف"), iIn=idx("الدخول"), iOut=idx("الخروج"),
            iExc=idx("نوع العذر"), iOutF=idx("مشوار خارج المصنع (نعم/لا)"), iNote=idx("ملاحظة");
      if(iDate<0||iEmp<0) return A.toast("خطأ","عناوين الأعمدة غير صحيحة");
      data=A.load();
      for(let i=1;i<rows.length;i++){
        const r=rows[i];
        const date=(r[iDate]||"").trim();
        const name=(r[iEmp]||"").trim();
        if(!date||!name) continue;
        const ymKey=date.slice(0,7);
        A.ensureMonthSettings(data, ymKey);
        const emp=A.loginEmployee(data,name);
        if(!emp) continue;
        if(!data.attendance[date]) data.attendance[date]={};
        data.attendance[date][emp.id]={date,employeeId:emp.id,checkIn:iIn>=0?(r[iIn]||"").trim():"",checkOut:iOut>=0?(r[iOut]||"").trim():"",excuseType:iExc>=0?(r[iExc]||"none").trim():"none",outOfFactory:iOutF>=0?((r[iOutF]||"").trim()==="نعم"):false,note:iNote>=0?(r[iNote]||"").trim():""};
      }
      A.save(data);
      A.toast("تم","تم استيراد الدوام.");
    };
    rr.readAsText(f,"utf-8");
  });

  // Init
  showTab("company");
})();
</script>
