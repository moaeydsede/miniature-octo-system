<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo" id="brandLogo"><span style="font-weight:900">₪</span></div>
        <div class="title">
          <b id="brandName">نظام الدوام والرواتب</b>
          <span id="brandSub">تسجيل الدخول</span>
        </div>
      </div>
      <div class="actions noprint" id="topActions"></div>
    </div>
  </div>

  <div class="container">
    <div class="grid cols-2">
  <div class="card">
    <div class="card-h"><h2>تسجيل الدخول</h2><span class="badge">Static • RTL</span></div>
    <div class="card-b">
      <div class="pilltabs" id="loginTabs">
        <button data-tab="admin" class="active">دخول الإدارة / المدير</button>
        <button data-tab="employee">دخول الموظف (عرض فقط)</button>
      </div>
      <div class="hr"></div>

      <div id="adminPanel">
        <div class="row cols-2">
          <div>
            <label>نوع الدخول</label>
            <select id="roleSelect"><option value="admin">Admin</option><option value="manager">Manager</option></select>
          </div>
          <div>
            <label>اسم المستخدم</label>
            <input id="username" placeholder="admin" autocomplete="username" />
          </div>
        </div>
        <div style="margin-top:10px">
          <label>كلمة السر</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
          <button class="btn green" id="loginAdminBtn">دخول</button>
          <button class="btn" id="demoHintBtn">بيانات الدخول</button>
        </div>
        <div class="help" style="margin-top:10px">
          <div>Admin ثابت: <b>admin / admin123</b></div>
          <div class="small">المدراء يتم إنشاؤهم من لوحة Admin.</div>
        </div>
      </div>

      <div id="employeePanel" style="display:none">
        <label>اسم الموظف</label>
        <input id="empName" placeholder="اكتب الاسم كما هو مسجل" />
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
          <button class="btn green" id="loginEmpBtn">دخول</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>ملاحظات سريعة</h2></div>
    <div class="card-b">
      <div class="help">
        <ul style="margin:0;padding-inline-start:18px;line-height:1.9">
          <li>البيانات محفوظة داخل المتصفح (LocalStorage).</li>
          <li>استخدم Backup JSON من لوحة Admin لحفظ نسخة احتياطية.</li>
          <li>صك القبض يتم حفظه PDF من نافذة الطباعة.</li>
        </ul>
      </div>
      <div class="hr"></div>
      <button class="btn blue" id="resetBtn">إعادة ضبط البيانات (تحذير)</button>
    </div>
  </div>
</div>

<script>
(function(){
  const A = window.PayrollApp;
  const data = A.load();
  const brandName = document.getElementById("brandName");
  const brandLogo = document.getElementById("brandLogo");
  if(data.company.companyName) brandName.textContent = data.company.companyName;
  if(data.company.companyLogo) brandLogo.innerHTML = '<img alt="logo" src="'+data.company.companyLogo+'">';

  function setTab(tab){
    document.querySelectorAll("#loginTabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
    document.getElementById("adminPanel").style.display = (tab==="admin")?"block":"none";
    document.getElementById("employeePanel").style.display = (tab==="employee")?"block":"none";
  }
  document.getElementById("loginTabs").addEventListener("click",(e)=>{
    const btn = e.target.closest("button"); if(!btn) return;
    setTab(btn.dataset.tab);
  });

  document.getElementById("demoHintBtn").addEventListener("click", ()=>{
    A.toast("بيانات الدخول","Admin: admin / admin123 — Managers: من لوحة الإدارة.");
  });

  document.getElementById("loginAdminBtn").addEventListener("click", ()=>{
    const role = document.getElementById("roleSelect").value;
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;

    if(role==="admin"){
      if(A.loginAdmin(u,p)){
        A.setSession({role:"admin", username:"admin", ts: Date.now()});
        location.href="./admin.html";
      }else A.toast("فشل الدخول","تأكد من البيانات.");
      return;
    }
    const m = A.loginManager(data,u,p);
    if(m){
      A.setSession({role:"manager", username:m.username, managerId:m.id, ts: Date.now()});
      location.href="./manager.html";
    }else A.toast("فشل الدخول","بيانات مدير غير صحيحة.");
  });

  document.getElementById("loginEmpBtn").addEventListener("click", ()=>{
    const name = document.getElementById("empName").value;
    const emp = A.loginEmployee(data, name);
    if(emp){
      A.setSession({role:"employee", employeeId: emp.id, name: emp.name, ts: Date.now()});
      location.href="./employee.html";
    }else A.toast("غير موجود","اسم الموظف غير مسجل.");
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(!confirm("سيتم حذف جميع البيانات من هذا المتصفح. متابعة؟")) return;
    localStorage.removeItem("payroll_static_v1");
    A.toast("تم","تمت إعادة الضبط.");
    setTimeout(()=>location.reload(), 700);
  });
})();
</script>

  </div>

  <div class="toast" id="toast">
    <div class="t">—</div>
    <div class="m">—</div>
  </div>

  <div class="modal" id="modal">
    <div class="box">
      <div class="box-h">
        <b id="modalTitle">—</b>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn green" id="modalPrintBtn">طباعة / حفظ PDF</button>
          <button class="btn" id="modalCloseBtn">إغلاق</button>
        </div>
      </div>
      <div class="box-b" id="modalBody"></div>
    </div>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>
